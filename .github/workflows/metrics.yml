name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Profile overview: activity, community and repository stats
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.OKKAHAI }}
          user: Okkahai
          template: classic
          filename: metrics/overview.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Istanbul
          plugin_lines: yes

      # Languages by code size
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.OKKAHAI }}
          user: Okkahai
          template: classic
          filename: metrics/languages.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # Isometric contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.OKKAHAI }}
          user: Okkahai
          template: classic
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Organizations and repositories contributed to
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.OKKAHAI }}
          user: Okkahai
          template: classic
          filename: metrics/notable.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
